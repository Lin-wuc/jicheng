<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>贪吃蛇 · 大一招新考核（版本二：阶段二 AI 自动玩）</title>
<!--
  ============================================================
  贪吃蛇 · 协会招新考核作品 —— 版本二（阶段二：AI 自动玩）
  纯前端单文件（HTML + CSS + JS），无任何框架依赖，双击即可运行。
  本版本 = 版本一（阶段一：人类可玩）的全部内容
           + 阶段二硬指标：AI 自动控制蛇，连续吃完 15 个食物不死
  与版本一的差别只有「AI 自动玩」这一项，没有加入任何新增功能。
  ============================================================
-->
<style>
/* ---------- 配色：深色单套主题 ---------- */
:root {
  --bg: #0f1420;
  --panel: #1a2233;
  --panel2: #222c44;
  --border: #2c3a5c;
  --board-bg: #141c2e;
  --grid: rgba(255,255,255,0.05);
  --text: #e8edf7;
  --text-dim: #9aa7c4;
  --accent: #34d399;
  --accent2: #fbbf24;
  --danger: #f87171;
  --head: #22c55e;
  --body: #16a34a;
  --food: #f43f5e;
  --food-glow: rgba(244,63,94,0.45);
  --shadow: 0 20px 60px rgba(0,0,0,0.55);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  transition: background .3s, color .3s;
}
.wrap {
  width: 100%;
  max-width: 560px;
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 20px;
  box-shadow: var(--shadow);
  padding: 22px 22px 24px;
  transition: background .3s;
}
header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 14px; }
h1 { font-size: 22px; font-weight: 800; letter-spacing: 1px; }
h1 .dot { color: var(--food); }
.toolbar { display: flex; gap: 8px; flex-wrap: wrap; }
button {
  font: inherit; font-size: 13px; font-weight: 600;
  border: 1px solid var(--border); background: var(--panel2); color: var(--text);
  border-radius: 9px; padding: 7px 12px; cursor: pointer;
  transition: transform .06s, background .2s;
}
button:hover { background: var(--accent); color: #fff; border-color: var(--accent); }
button:active { transform: scale(.96); }
button.primary { background: var(--accent); color: #fff; border-color: var(--accent); }
button.primary:hover { filter: brightness(1.08); }
button.ai-on { background: var(--accent2); color: #fff; border-color: var(--accent2); }

/* 计分板（当前状态：得分 / 最高分 / 局数 / AI 连续吃） */
.stats {
  display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 14px 0 12px;
}
.stat { background: var(--panel2); border: 1px solid var(--border); border-radius: 12px; padding: 9px 6px; text-align: center; }
.stat .v { font-size: 20px; font-weight: 800; }
.stat .l { font-size: 11px; color: var(--text-dim); margin-top: 2px; }
.stat.highlight .v { color: var(--accent); }
.stat.ai .v { color: var(--accent2); }

/* 画布 */
.board-wrap { position: relative; width: 100%; }
canvas {
  display: block; width: 100%; height: auto;
  background: var(--board-bg); border: 1px solid var(--border);
  border-radius: 14px; transition: background .3s;
}
.overlay {
  position: absolute; inset: 0; border-radius: 14px;
  display: none; align-items: center; justify-content: center; text-align: center;
  background: rgba(0,0,0,0.62); color: #fff; flex-direction: column; gap: 10px; padding: 16px;
}
.overlay.show { display: flex; }
.overlay h2 { font-size: 26px; }
.overlay p { color: #cfd8ea; font-size: 14px; max-width: 420px; line-height: 1.6; }
.overlay .badge { background: var(--accent); color:#fff; border-radius: 20px; padding: 6px 16px; font-weight:700; }

.hint { margin-top: 14px; font-size: 12.5px; color: var(--text-dim); line-height: 1.7; }
.hint kbd {
  background: var(--panel2); border: 1px solid var(--border); border-radius: 5px;
  padding: 1px 6px; font-size: 11px; font-family: inherit;
}
.footer { margin-top: 14px; font-size: 11.5px; color: var(--text-dim); text-align: center; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>🐍 贪吃<span class="dot">蛇</span></h1>
    <div class="toolbar">
      <button id="btnAI" title="开启/关闭 AI 自动玩">🤖 AI 自动玩</button>
    </div>
  </header>

  <!-- 状态显示：得分 / 最高分 / 局数 / AI 连续吃 -->
  <div class="stats">
    <div class="stat"><div class="v" id="score">0</div><div class="l">得分</div></div>
    <div class="stat highlight"><div class="v" id="best">0</div><div class="l">最高分</div></div>
    <div class="stat"><div class="v" id="rounds">0</div><div class="l">局数</div></div>
    <div class="stat ai"><div class="v" id="aiStreak">–</div><div class="l">AI连续吃</div></div>
  </div>

  <div class="board-wrap">
    <canvas id="game" width="480" height="480"></canvas>
    <!-- 覆盖层：开始 / 暂停 / 结束 / AI 达标 -->
    <div class="overlay" id="overlay">
      <h2 id="ovTitle">贪吃蛇</h2>
      <p id="ovText">方向键 / WASD 控制方向，空格暂停，吃到食物得分并变长。</p>
      <button class="primary" id="btnStart">开始游戏</button>
    </div>
  </div>

  <div class="hint">
    <kbd>↑</kbd><kbd>↓</kbd><kbd>←</kbd><kbd>→</kbd> 或 <kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> 移动 ·
    <kbd>空格</kbd> 暂停/继续 · <kbd>R</kbd> 重开 · 速度：<button id="btnSpeed" style="padding:2px 8px">中</button>
    <br>得分规则：每吃 1 个食物 +10；撞墙或撞到自己则本局结束。点右上角「🤖 AI 自动玩」可让 AI 接管。
  </div>
  <div class="footer">阶段一：人类可玩 · 阶段二：AI 自动吃满 15 个食物即达标</div>
</div>

<script>
"use strict";
/* ============================================================
 * 一、基础配置
 * ========================================================== */
const COLS = 20, ROWS = 20;          // 20x20 网格
const CELL = 480 / COLS;             // 每格像素
const BASE_SPEED = 160;              // 中速（毫秒/步）
const FOOD_VALUE = 10;               // 每个食物得分
const AI_TARGET = 15;                // 阶段二硬指标：AI 连续吃 15 个食物

const SPEEDS = { "慢": 240, "中": 160, "快": 100 };  // 速度档位
let speedLabel = "中";

// 四方向
const DIRS = [
  {x:0,y:-1}, {x:0,y:1}, {x:-1,y:0}, {x:1,y:0}
];

/* ============================================================
 * 二、游戏状态
 * ========================================================== */
let snake, dir, dirQueue, food;
let score = 0;
let best = 0;            // 本次打开页面的最高分
let rounds = 0;          // 本次打开页面玩了几局
let aiStreak = 0;        // AI 模式下连续吃到的食物数
let running = false;     // 游戏是否进行中
let paused = false;
let mode = "human";      // 'human' | 'ai'
let timer = null;

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

const $ = id => document.getElementById(id);
const elScore = $("score"), elBest = $("best"), elRounds = $("rounds"),
      elStreak = $("aiStreak"), elOverlay = $("overlay"),
      elOvTitle = $("ovTitle"), elOvText = $("ovText"), elBtnStart = $("btnStart");

/* ============================================================
 * 三、计分：最高分 / 局数 / 状态刷新
 * ========================================================== */
function saveBest() {
  if (score > best) best = score;
}
function bumpRounds() { rounds++; }
function refreshStats() {
  elScore.textContent = score;
  elBest.textContent = best;
  elRounds.textContent = rounds;
  elStreak.textContent = mode === "ai" ? (aiStreak + "/" + AI_TARGET) : "–";
}

/* ============================================================
 * 四、游戏初始化与主循环
 * ========================================================== */
function initGame() {
  const cx = Math.floor(COLS/2), cy = Math.floor(ROWS/2);
  snake = [{x:cx,y:cy},{x:cx-1,y:cy},{x:cx-2,y:cy}];
  dir = {x:1,y:0}; dirQueue = [];
  score = 0; aiStreak = 0;
  spawnFood();
  refreshStats();
  draw();
}

function key(p){ return p.x + "," + p.y; }
function inBoard(p){ return p.x>=0 && p.x<COLS && p.y>=0 && p.y<ROWS; }

function spawnFood() {
  const occ = new Set(snake.map(key));
  const free = [];
  for (let y=0;y<ROWS;y++) for (let x=0;x<COLS;x++) {
    const k = x+","+y; if (!occ.has(k)) free.push({x,y});
  }
  if (free.length === 0) { winGame(); return; }   // 棋盘填满 → 通关
  food = free[Math.floor(Math.random()*free.length)];
}

/* ---- 主循环：每 tick 走一步 ---- */
function tick() {
  if (!running || paused) return;
  const step = (mode === "ai") ? aiDecide() : popDir();   // AI 或 玩家方向
  if (!step) { gameOver("撞到障碍，无法移动"); return; }
  const head = { x: snake[0].x + step.x, y: snake[0].y + step.y };

  // 撞墙判定
  if (!inBoard(head)) { gameOver("撞墙了"); return; }
  const eating = head.x === food.x && head.y === food.y;
  // 撞自己判定：若本步不吃食物，蛇尾会前移让出一格（可走）；若吃食物则尾巴不动，整条身体都占位。
  for (let i = 0; i < snake.length; i++) {
    if (i === snake.length-1 && !eating) continue;      // 不吃时尾巴让位
    if (snake[i].x === head.x && snake[i].y === head.y) { gameOver("撞到自己了"); return; }
  }

  snake.unshift(head);
  if (eating) {
    score += FOOD_VALUE;
    if (mode === "ai") aiStreak++;
    if (mode === "human") { saveBest(); }
    if (aiStreak >= AI_TARGET && mode === "ai") { aiPass(); return; }
    spawnFood();
  } else {
    snake.pop();
  }
  refreshStats();
  draw();
}

/* 玩家方向：消费方向队列（允许多次快速转向，更顺手） */
function popDir() {
  while (dirQueue.length) {
    const d = dirQueue.shift();
    if (d.x === -dir.x && d.y === -dir.y) continue;   // 禁止 180° 反向
    dir = d; break;
  }
  return dir;
}

/* ---- 游戏控制 ---- */
function startGame() {
  if (!running) {
    initGame();
    running = true; paused = false;
  } else { paused = false; }
  elOverlay.classList.remove("show");
  clearTimer(); timer = setInterval(tick, SPEEDS[speedLabel]);
  draw();
}
function pauseGame() {
  paused = true; elOverlay.classList.add("show");
  elOvTitle.textContent = "⏸ 已暂停";
  elOvText.textContent = "按 空格 继续，或点下方按钮重新开始。";
  elBtnStart.textContent = "继续游戏";
  clearTimer();
}
function resetGame() {
  clearTimer();
  initGame();
  running = false; paused = false;
  elOverlay.classList.add("show");
  elOvTitle.textContent = "贪吃蛇";
  elOvText.textContent = (mode === "ai")
    ? "🤖 AI 模式已开启：点击开始后由 AI 自动吃食物，连续吃满 " + AI_TARGET + " 个即达标，全程无需操作。"
    : "方向键 / WASD 控制方向，空格暂停，吃到食物得分并变长。";
  elBtnStart.textContent = "开始游戏";
  draw();
}
function clearTimer(){ if (timer) { clearInterval(timer); timer = null; } }

function gameOver(reason) {
  clearTimer();
  running = false;
  saveBest();
  bumpRounds();
  refreshStats();
  elOverlay.classList.add("show");
  elOvTitle.textContent = "游戏结束";
  elOvText.innerHTML = reason + "。<br>本局得分 <b>" + score + "</b>，蛇身长度 " + snake.length +
    "，最高分 " + best + "。";
  elBtnStart.textContent = "再来一局";
  draw();
}
function winGame() {
  clearTimer(); running = false; saveBest(); bumpRounds(); refreshStats();
  elOverlay.classList.add("show");
  elOvTitle.textContent = "🏆 通关！";
  elOvText.textContent = "棋盘被填满，你太强了！得分 " + score;
  elBtnStart.textContent = "再来一局";
}
function aiPass() {
  clearTimer(); running = false; saveBest(); bumpRounds(); refreshStats();
  elOverlay.classList.add("show");
  elOvTitle.innerHTML = "🤖 AI 达标！";
  elOvText.innerHTML = '<span class="badge">阶段二硬指标达成</span><br>AI 自动连续吃满 ' + AI_TARGET +
    ' 个食物，未撞墙、未撞自己，全程零人工操作。<br>最终得分 ' + score + '。';
  elBtnStart.textContent = "再来一局";
}

/* ============================================================
 * 五、AI 自动玩（阶段二）
 *   —— 这是本作最关键、也是你要在 README 里向评委"讲清楚"的地方。
 *
 *  核心思路（防纯粘贴，理解后再复述）：
 *  ① 用 BFS 找到"蛇头 → 食物"的最短路径；
 *  ② 沿该路径走会吃到食物、蛇变长一格。走到食物后，用"洪泛填充"检查
 *     蛇头还能到达的空白格是否 ≥ 蛇身长度 —— 若空间足够，说明吃完这口
 *     不会把自己困死（这是"贪吃蛇为什么能自动避开死路"的答案）；
 *  ③ 若吃食物这条路不安全，就退而求其次：走向蛇尾（尾巴一直在移动，
 *     是天然的"安全区"），用最长的路消耗时间等新空间；
 *  ④ 万不得已再挑一个不会立刻撞死的方向；连这个都没有，才判负。
 * ========================================================== */
function aiDecide() {
  // 把"路径上的下一个格子"换算成"从蛇头出发的方向向量"
  const toDir = (from, to) => ({ x: to.x - from.x, y: to.y - from.y });
  const occ = new Set(snake.map(key));
  const pathToFood = bfs(snake[0], food, occ, true);
  if (pathToFood) {
    const after = simulatePath(snake, pathToFood);       // 模拟吃到食物后的蛇
    if (safeAfterMove(after)) return toDir(snake[0], pathToFood[0]);   // 吃完仍安全 → 吃！
  }
  // 回退：走向蛇尾（尾巴让位，等于追着空间走）
  const tail = snake[snake.length-1];
  const pathToTail = bfs(snake[0], tail, occ, false);
  if (pathToTail && pathToTail.length > 1) {
    const after = simulatePath(snake, [pathToTail[0]]);
    if (safeAfterMove(after)) return toDir(snake[0], pathToTail[0]);
  }
  // 兜底：挑一个不立刻撞死的方向
  for (const d of DIRS) {
    const np = { x: snake[0].x + d.x, y: snake[0].y + d.y };
    if (!inBoard(np)) continue;
    const after = simulatePath(snake, [d]);
    if (safeAfterMove(after)) return d;
  }
  return null;   // 真走投无路了
}

/* BFS 最短路径：返回"从 start 到 target 的逐格路径"（不含 start，含 target）。
   allowTail：是否允许把蛇尾当空格走（蛇尾下一步会移动，通常是安全通道）。 */
function bfs(start, target, occ, allowTail) {
  if (start.x===target.x && start.y===target.y) return [];
  const q = [{ p: start, path: [] }];
  const visited = new Set([key(start)]);
  while (q.length) {
    const { p, path } = q.shift();
    for (const d of DIRS) {
      const np = { x: p.x+d.x, y: p.y+d.y };
      const k = key(np);
      if (!inBoard(np)) continue;
      const isTail = np.x===snake[snake.length-1].x && np.y===snake[snake.length-1].y;
      if (occ.has(k) && !(allowTail && isTail)) continue;   // 障碍跳过（尾巴可选放行）
      if (visited.has(k)) continue;
      const npath = path.concat([np]);
      if (np.x===target.x && np.y===target.y) return npath;
      visited.add(k);
      q.push({ p: np, path: npath });
    }
  }
  return null;
}

/* 模拟沿 steps 走完后的蛇：走到食物则增长一格，否则正常前进 */
function simulatePath(snakeArr, steps) {
  let s = snakeArr.slice();
  for (const st of steps) {
    s = [st].concat(s);
    if (!(st.x===food.x && st.y===food.y)) s.pop();
  }
  return s;
}

/* 安全性检查：洪泛填充——蛇头能到达的空白格是否不少于蛇长。
   若不够，说明蛇把自己围死，迟早撞上，应放弃这条路。 */
function safeAfterMove(snakeArr) {
  const blocked = new Set(snakeArr.map(key));
  const head = snakeArr[0];
  const q = [head], seen = new Set([key(head)]);
  let count = 0;
  while (q.length) {
    const p = q.shift(); count++;
    if (count >= snakeArr.length) return true;   // 空间够就立即放行
    for (const d of DIRS) {
      const np = { x:p.x+d.x, y:p.y+d.y }, k = key(np);
      if (inBoard(np) && !blocked.has(k) && !seen.has(k)) { seen.add(k); q.push(np); }
    }
  }
  return count >= snakeArr.length;
}

/* ============================================================
 * 六、绘制（Canvas）
 * ========================================================== */
function cssVar(n){ return getComputedStyle(document.body).getPropertyValue(n).trim(); }
function draw() {
  const bg   = cssVar("--board-bg");
  const grid = cssVar("--grid");
  const hd   = cssVar("--head");
  const bd   = cssVar("--body");
  const fd   = cssVar("--food");
  const fg   = cssVar("--food-glow");

  ctx.fillStyle = bg; ctx.fillRect(0,0,canvas.width,canvas.height);
  // 网格
  ctx.strokeStyle = grid; ctx.lineWidth = 1;
  for (let i=1;i<COLS;i++){ ctx.beginPath(); ctx.moveTo(i*CELL,0); ctx.lineTo(i*CELL,canvas.height); ctx.stroke(); }
  for (let i=1;i<ROWS;i++){ ctx.beginPath(); ctx.moveTo(0,i*CELL); ctx.lineTo(canvas.width,i*CELL); ctx.stroke(); }

  // 食物（带光晕呼吸）
  if (food) {
    const t = Date.now()/300;
    const g = 1 + Math.sin(t)*0.12;
    ctx.fillStyle = fg;
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.48*g, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = fd;
    ctx.beginPath(); ctx.arc(food.x*CELL+CELL/2, food.y*CELL+CELL/2, CELL*0.34, 0, Math.PI*2); ctx.fill();
  }

  // 蛇身（圆角方块）
  for (let i=snake.length-1;i>=0;i--) {
    const p = snake[i], r = CELL*0.36;
    ctx.fillStyle = (i===0) ? hd : bd;
    ctx.beginPath();
    ctx.roundRect(p.x*CELL+CELL/2-r, p.y*CELL+CELL/2-r, r*2, r*2, r);
    ctx.fill();
  }
  // 蛇头眼睛
  if (snake.length) {
    const h = snake[0], ex = h.x*CELL+CELL/2, ey = h.y*CELL+CELL/2;
    ctx.fillStyle = "#fff";
    const d = dir, ox = d.x*CELL*0.18, oy = d.y*CELL*0.18;
    [[-1,-1],[1,-1]].forEach(([sx,sy])=>{
      let px = ex+ox + sx*CELL*0.14, py = ey+oy + sy*CELL*0.14;
      // 让眼睛始终朝移动方向排列
      if (d.x!==0){ px = ex+ox + sx*CELL*0.14; py = ey+oy; }
      else { px = ex+ox; py = ey+oy + sx*CELL*0.14; }
      ctx.beginPath(); ctx.arc(px,py,CELL*0.09,0,Math.PI*2); ctx.fill();
    });
  }
}

/* ============================================================
 * 七、AI 模式开关
 * ========================================================== */
function toggleAI() {
  mode = (mode === "human") ? "ai" : "human";
  $("btnAI").classList.toggle("ai-on", mode==="ai");
  $("btnAI").textContent = mode==="ai" ? "🤖 AI:开" : "🤖 AI 自动玩";
  if (mode==="ai") {
    // 切换后直接给一段 AI 演示，方便评委看效果
    clearTimer(); initGame(); running=true; paused=false;
    elOverlay.classList.remove("show");
    timer = setInterval(tick, SPEEDS[speedLabel]);
  } else {
    resetGame();
  }
}

/* ============================================================
 * 八、事件绑定
 * ========================================================== */
document.addEventListener("keydown", e => {
  const map = { ArrowUp:{x:0,y:-1}, ArrowDown:{x:0,y:1}, ArrowLeft:{x:-1,y:0}, ArrowRight:{x:1,y:0},
                w:{x:0,y:-1}, s:{x:0,y:1}, a:{x:-1,y:0}, d:{x:1,y:0},
                W:{x:0,y:-1}, S:{x:0,y:1}, A:{x:-1,y:0}, D:{x:1,y:0} };
  if (map[e.key]) {
    if (mode==="ai") return;              // AI 模式忽略玩家方向
    if (!running) { startGame(); }        // 未开始时按方向键直接开玩
    else dirQueue.push(map[e.key]);
    e.preventDefault();
  } else if (e.key === " ") {
    if (!running) startGame();
    else if (paused) { paused=false; elOverlay.classList.remove("show"); clearTimer(); timer=setInterval(tick, SPEEDS[speedLabel]); draw(); }
    else pauseGame();
    e.preventDefault();
  } else if (e.key === "r" || e.key === "R") { resetGame(); }
});
canvas.addEventListener("click", () => { if (!running) startGame(); });

$("btnStart").addEventListener("click", () => { if (!running) startGame(); else { paused=false; elOverlay.classList.remove("show"); clearTimer(); timer=setInterval(tick,SPEEDS[speedLabel]); draw(); } });
$("btnAI").addEventListener("click", toggleAI);
$("btnSpeed").addEventListener("click", function() {
  const order = Object.keys(SPEEDS);
  speedLabel = order[(order.indexOf(speedLabel)+1) % order.length];
  this.textContent = speedLabel;
  if (running && !paused) { clearTimer(); timer=setInterval(tick, SPEEDS[speedLabel]); }
});

/* ============================================================
 * 九、启动
 * ========================================================== */
initGame();
resetGame();
</script>
</body>
</html>
